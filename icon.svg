<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#vaultGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Vault / Camera Aperture Visual -->
  <g filter="url(#glow)" transform="translate(106, 106)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Camera body / Vault frame -->
    <rect x="15" y="45" width="270" height="210" rx="35" />
    <path d="M100 45 L120 15 L180 15 L200 45 Z" fill="rgba(255,255,255,0.15)" stroke-width="20" />
    <circle cx="150" cy="150" r="55" />
    <circle cx="230" cy="90" r="10" fill="#ffffff" stroke="none" />
    <!-- Aperture accent inner -->
    <line x1="150" y1="95" x2="150" y2="115" stroke="#06b6d4" stroke-width="12" />
    <line x1="150" y1="185" x2="150" y2="205" stroke="#06b6d4" stroke-width="12" />
    <line x1="95" y1="150" x2="115" y2="150" stroke="#06b6d4" stroke-width="12" />
    <line x1="185" y1="150" x2="205" y2="150" stroke="#06b6d4" stroke-width="12" />
  </g>
</svg>
